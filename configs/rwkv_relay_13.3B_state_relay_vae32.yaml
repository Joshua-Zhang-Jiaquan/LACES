# STAR-LDM-style on 13.3B (frozen): VAE + Latent Diffusion + state injection.
#
# Single-GPU run, 61 layers × 4096 hidden × 64 heads × 64 head_dim.
# Requires H200 (141 GB) — A100 (80 GB) will OOM at any batch size > 1
# with the 26.6 GB frozen backbone + activations.
#
# state_basis params: 61 × 16 × 64 × 64 × 64 ≈ 256M  (largest trainable group)
# Throughput: ~5-7 s/step on H200 (frozen forward is most of the cost)
#             200k steps ≈ 14-16 days

config_name: rwkv_relay_13.3B_state_relay_vae32

data:
  use_preprocessed: true
  token_dir: /inspire/hdd/global_user/zhangjiaquan-253108540222/research/DiffRwkv/preprocessed_data/owt_rwkv_tokens/train
  latent_dir: null
  max_length: 512
  num_workers: 4
  max_samples: null
  use_external_latents: false

model:
  type: "rwkv_state_relay"
  rwkv_name: "BlinkDL/rwkv7-g1"
  rwkv_local_path: "/inspire/hdd/global_user/zhangjiaquan-253108540222/models/RWKV7-G1f-13.3B-HF"
  rwkv_trust_remote_code: true
  add_mask_token: false
  pad_token_strategy: "eos"

  encoder_type: "variational"
  latent_dim: 32
  n_basis: 16

  # Denoiser ε-predictor (small, z is 32-d)
  denoiser_hidden: 256
  denoiser_depth: 4
  denoiser_num_heads: 4
  denoiser_num_tokens: 4

training:
  seed: 42
  num_epochs: 50
  num_train_steps: 200000
  train_batch_size: 1              # ↓ 13.3B + bootstrap+real forward leaves little room
  eval_batch_size: 1
  dtype: bf16
  lr_schedule: cosine
  warmup_steps: 500
  resume: null
  world_size: 1
  save_every_n_steps: 50000
  stage: 3
  gen_type: ddpm
  ddp_find_unused_parameters: null

logging:
  run_name: relay-13.3B-sh-denoiser-vae32
  wandb_project: relay
  wandb_dir: ./outputs/
  log_freq: 100
  save_freq: 50000
  save_dir: ./outputs_relay

loss:
  text_loss_weight: 1.0
  diff_loss_weight: 1.0
  kl_weight: 0.05
  kl_warmup_steps: 2000
  free_bits: 0.1

optimizer:
  name: adamw
  lr: 5.0e-05                       # ↓ from 1e-4 at 0.4B/2.9B; bigger model needs lower LR
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  grad_clip_norm: 1.0

tokenizer:
  cache_dir: ./data/huggingface
  local_files_only: true

hydra:
  job:
    chdir: false
