# STAR-LDM-style: VAE encoder + Latent Diffusion + state injection (frozen 0.4B).
#
# Pipeline:
#   text → VAE encoder → (μ, σ) → reparam → z_0 (32-d)
#        │
#        ├── forward diff: z_t = √ᾱ_t·z_0 + √(1-ᾱ_t)·ε
#        │     Denoiser(z_t, t) → ε̂        [MSE(ε̂, ε) — diffusion loss]
#        │
#        └── alpha_predictors(z_0) → per-layer WKV state
#                → frozen RWKV(text, state-injected cache) → text logits [CE]
#
# Loss = CE + λ_diff·MSE + λ_KL(t)·KL_freebits

config_name: rwkv_relay_0.4B_state_relay_vae32

data:
  use_preprocessed: true
  token_dir: /inspire/hdd/global_user/zhangjiaquan-253108540222/research/DiffRwkv/preprocessed_data/owt_rwkv_tokens/train
  latent_dir: null
  max_length: 512
  num_workers: 4
  max_samples: null
  use_external_latents: false

model:
  type: "rwkv_state_relay"
  rwkv_name: "fla-hub/rwkv7-0.4B-world"
  rwkv_local_path: "/inspire/hdd/global_user/zhangjiaquan-253108540222/models/rwkv7-0.4B-world"
  rwkv_trust_remote_code: true
  add_mask_token: false
  pad_token_strategy: "eos"

  encoder_type: "variational"
  latent_dim: 32
  n_basis: 16

  # Denoiser ε-predictor (small, z is just 32-d)
  denoiser_hidden: 256
  denoiser_depth: 4
  denoiser_num_heads: 4
  denoiser_num_tokens: 4

training:
  seed: 42
  num_epochs: 50
  num_train_steps: 200000
  train_batch_size: 16
  eval_batch_size: 4
  dtype: bf16
  lr_schedule: cosine
  warmup_steps: 500
  resume: null
  world_size: 1
  save_every_n_steps: 50000
  stage: 3
  gen_type: ddpm

logging:
  run_name: relay-0.4B-sh-denoiser-vae32
  wandb_project: relay
  wandb_dir: ./outputs/
  log_freq: 100
  save_freq: 50000
  save_dir: ./outputs_relay

loss:
  text_loss_weight: 1.0
  diff_loss_weight: 1.0
  kl_weight: 0.05
  kl_warmup_steps: 2000
  free_bits: 0.1

optimizer:
  name: adamw
  lr: 1.0e-04
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  grad_clip_norm: 1.0

tokenizer:
  cache_dir: ./data/huggingface
  local_files_only: true

hydra:
  job:
    chdir: false
